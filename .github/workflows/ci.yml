name: CI - Calculadora Financiera (TDD)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar pip e instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Mensaje si falla
        if: failure()
        run: echo "❌ Alguna prueba falló. La integración se bloquea hasta corregir."